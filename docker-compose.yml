# OptAImum Master Docker Compose
# Services that run alongside the OpenClaw gateway (which runs natively on the host)
#
# Port Map:
#   3100  - Paperclip (governance control plane)
#   5433  - Paperclip Postgres (avoids conflict with postgres-superpower on 5432)
#   9867  - PinchTab (browser automation)
#   3000  - Agent Orchestrator (runs natively, not in Docker)
#   18789 - OpenClaw Gateway (runs natively, not in Docker)

services:
  # --- Paperclip Governance Layer ---
  paperclip-db:
    image: postgres:17-alpine
    container_name: paperclip-db
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD}
      POSTGRES_DB: paperclip
    volumes:
      - paperclip-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  paperclip:
    build:
      context: ../paperclip
      dockerfile: Dockerfile
    container_name: paperclip-server
    ports:
      - "3100:3100"
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      DATABASE_URL: postgres://paperclip:${PAPERCLIP_DB_PASSWORD}@paperclip-db:5432/paperclip
      PAPERCLIP_DEPLOYMENT_MODE: local_trusted
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      SERVE_UI: "true"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      paperclip-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- PinchTab Browser Automation ---
  pinchtab:
    build:
      context: ../pinchtab
      dockerfile: Dockerfile
    container_name: pinchtab-browser
    ports:
      - "9867:9867"
    environment:
      BRIDGE_BIND: "0.0.0.0"
      BRIDGE_PORT: "9867"
      BRIDGE_HEADLESS: "true"
      BRIDGE_TOKEN: ${PINCHTAB_TOKEN:-}
      BRIDGE_STEALTH: "light"
      BRIDGE_MAX_TABS: "10"
      BRIDGE_STATE_DIR: "/data"
    volumes:
      - pinchtab-data:/data
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9867/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  paperclip-pgdata:
  paperclip-data:
  pinchtab-data:
